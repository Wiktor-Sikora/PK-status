services:
  backend:
    build: ./backend
    environment:
      TARGETS: >-
        PK=https://pk.edu.pl,
        Biblioteka=https://www.biblos.pk.edu.pl,
        Dziekanat=https://ehms.pk.edu.pl,
        Rekrutacja=https://rekrutacja.pk.edu.pl,
        SIP=https://sip.pk.edu.pl,
        Elektroniczny Obieg Dokumentów=https://eod.pk.edu.pl,
        Eclipse=https://eclipse.elektron.pk.edu.pl,
        Plany WIEiK=https://plany.wieik.pk.edu.pl,
        Szkoła Doktorska=https://szkoladoktorska.pk.edu.pl,
        Akademiki=https://akademiki.pk.edu.pl,
        Samorząd=https://samorzad.pk.edu.pl,
        Spis pracowników=https://spispracownikow.pk.edu.pl,
        Centrum Cyfryzacji=https://cc.pk.edu.pl,
        Delta=https://delta.pk.edu.pl,
        Eduroam=https://eduroam.pk.edu.pl,
        SUS=https://sus.pk.edu.pl,
        Pomoc=https://pomoc.pk.edu.pl,
        CeWSA=https://cewsa.pk.edu.pl,
        CPIP=https://cpip.pk.edu.pl,
        Sklep=https://sklep.pk.edu.pl,
        WA=https://arch.pk.edu.pl,
        WIEiK=https://wieik.pk.edu.pl,
        WIiM=https://it.pk.edu.pl,
        WIiTCh=https://chemia.pk.edu.pl,
        WILiT=https://wilit.pk.edu.pl,
        WIMiF=https://imf.pk.edu.pl,
        WISiE=https://wisie.pk.edu.pl,
        WM=https://mech.pk.edu.pl,
        Dział Badań Naukowych=https://dbn.pk.edu.pl,
        CRIS=https://cris.pk.edu.pl/index.seam,
        Wydawnictwo=https://wydawnictwo.pk.edu.pl,
        Transfer=https://transfer.pk.edu.pl,
        IRO=https://iro.pk.edu.pl,
        Kariery=https://kariery.pk.edu.pl,
        Klub biznesu=https://klubbiznesu.pk.edu.pl,
        Szkoły=https://szkoly.pk.edu.pl,
        Enterpirse Europe Network=https://een.pk.edu.pl,
        Centrum Dostępności=https://cd.pk.edu.pl,
        Erasmus=https://erasmus.pk.edu.pl,
        mLegitymacje=https://mlegitymacje.pk.edu.pl
      POLL_INTERVAL: "60s"
      DB_PATH: "/data/pk-status.db"
      PORT: "8080"
    volumes:
      - pkdata:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pkdata:
